name: release

# Publishing needs two things this repository cannot hold: an npm token and a hosted remote.
# `docs/PUBLISH.md` covers the git side; this workflow covers npm once `NPM_TOKEN` exists.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the publish rehearsal cannot push a shallow history
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Install dev tooling
        run: npm install --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: node --test
      - name: Offline simulation
        run: node scripts/simulate.js
      - name: Install smoke
        run: node scripts/dev/install-smoke.mjs
      - name: Publish flow rehearsal
        run: node scripts/dev/publish-rehearse.mjs
      - name: The tag must match the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
            const tag = process.env.GITHUB_REF_NAME.replace(/^v/u, '');
            if (version !== tag) {
              console.error('package.json is ' + version + ' but the tag is ' + process.env.GITHUB_REF_NAME);
              process.exit(1);
            }
            console.log('tag matches package version ' + version);
          "
      - name: npm publish
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
