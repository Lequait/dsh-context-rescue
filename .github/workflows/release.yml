name: release

# Publishing needs one thing this repository does not hold: an npm token. Without it the whole
# chain still runs -- type check, tests, simulation, install smoke, publish rehearsal, tag/version
# match -- and the npm step reports why it was skipped instead of failing the run. A red run for a
# missing secret teaches people to ignore red runs; a run that says "skipped: no NPM_TOKEN" does not.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the publish rehearsal cannot push a shallow history
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Install dev tooling
        run: npm install --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: node --test
      - name: Offline simulation
        run: node scripts/simulate.js
      - name: Install smoke
        run: node scripts/dev/install-smoke.mjs
      - name: Publish flow rehearsal
        run: node scripts/dev/publish-rehearse.mjs
      - name: The tag must match the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
            const tag = process.env.GITHUB_REF_NAME.replace(/^v/u, '');
            if (version !== tag) {
              console.error('package.json is ' + version + ' but the tag is ' + process.env.GITHUB_REF_NAME);
              process.exit(1);
            }
            console.log('tag matches package version ' + version);
          "
      - name: npm publish
        if: ${{ secrets.NPM_TOKEN != '' }}
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Report the npm step
        run: |
          if [ -n "${{ secrets.NPM_TOKEN }}" ]; then
            echo "Published to npm."
          else
            echo "Skipped npm publish: no NPM_TOKEN repository secret."
            echo "The marketplace entry uses the git source, so this repository is installable"
            echo "without npm. Add the secret to publish an npm-sourced version too."
          fi
          {
            echo "### Release ${{ github.ref_name }}"
            echo ""
            if [ -n "${{ secrets.NPM_TOKEN }}" ]; then
              echo "- every gate passed and the tarball was published to npm";
            else
              echo "- every gate passed; npm publish was skipped (no NPM_TOKEN)";
            fi
            echo "- the git source in market/index.json is what the listing installs"
          } >> "$GITHUB_STEP_SUMMARY"
