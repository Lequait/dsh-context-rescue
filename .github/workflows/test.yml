name: test

on:
  push:
    # this repository's default branch is `master`; `main` is kept so a renamed
    # default branch keeps running the suite instead of silently skipping it
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          # the publish rehearsal pushes a clone of this checkout into a bare remote,
          # and git refuses to push a shallow history
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # the plugin has one runtime dependency (the schema library), so every job
      # needs the dependency tree, not just the job that type-checks
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Type check
        if: matrix.node == 22
        run: npm run typecheck
      - name: Unit tests
        run: node --test
      - name: Offline simulation
        run: node scripts/simulate.js
      - name: Package install smoke
        if: matrix.node == 22
        run: node scripts/dev/install-smoke.mjs
      - name: Publish rehearsal
        if: matrix.node == 22
        run: node scripts/dev/publish-rehearse.mjs
