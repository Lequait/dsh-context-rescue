name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install dev tooling
        if: matrix.node == 22
        run: npm install --no-audit --no-fund
      - name: Type check
        if: matrix.node == 22
        run: npm run typecheck
      - name: Unit tests
        run: node --test
      - name: Offline simulation
        run: node scripts/simulate.js
      - name: Package install smoke
        if: matrix.node == 22
        run: node scripts/dev/install-smoke.mjs
      - name: Publish rehearsal
        if: matrix.node == 22
        run: node scripts/dev/publish-rehearse.mjs
