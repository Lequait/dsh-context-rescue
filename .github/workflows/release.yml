name: release

# Publishing needs one thing this repository does not hold: an npm token. Without it the whole
# chain still runs -- type check, tests, simulation, install smoke, publish rehearsal, tag/version
# match -- and the npm step reports why it was skipped instead of failing the run. A red run for a
# missing secret teaches people to ignore red runs; a run that says "skipped: no NPM_TOKEN" does not.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # provenance

jobs:
  release:
    # A tag is the only thing that should publish. The branch push that creates a tag would
    # otherwise run this whole chain a second time and report a skipped npm step for no reason.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      # Declared once at the job level: a step-level `if` can read it as `env.NPM_TOKEN`,
      # while a step's own `env` block would only exist inside that step.
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the publish rehearsal cannot push a shallow history
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Install dev tooling
        run: npm ci --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: node --test
      - name: Offline simulation
        run: node scripts/simulate.js
      - name: Install smoke
        run: node scripts/dev/install-smoke.mjs
      - name: Publish flow rehearsal
        run: node scripts/dev/publish-rehearse.mjs
      - name: The tag must match the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
            const tag = process.env.GITHUB_REF_NAME.replace(/^v/u, '');
            if (version !== tag) {
              console.error('package.json is ' + version + ' but the tag is ' + process.env.GITHUB_REF_NAME);
              process.exit(1);
            }
            console.log('tag matches package version ' + version);
          "
      - name: npm publish
        # `secrets` is not available inside `if:`; map it into `env` and test that instead.
        if: env.NPM_TOKEN != ''
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Report the npm step
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "${NPM_TOKEN}" ]; then
            echo "Published to npm."
          else
            echo "Skipped npm publish: no NPM_TOKEN repository secret."
            echo "The marketplace entry installs from the git source, so the repository works without npm."
          fi
          {
            echo "### Release ${REF_NAME}"
            echo ""
            if [ -n "${NPM_TOKEN}" ]; then
              echo "- every gate passed and the tarball was published to npm"
            else
              echo "- every gate passed; npm publish was skipped (no NPM_TOKEN)"
            fi
            echo "- market/index.json pins the git commit, which is what a listing installs"
          } >> "$GITHUB_STEP_SUMMARY"
